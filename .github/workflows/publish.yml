name: Publish to pub.dev

on:
  push:
    tags:
      # Must match the tag pattern configured on pub.dev: v{{version}}
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    permissions:
      id-token: write # OIDC token for pub.dev, no stored secret
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
